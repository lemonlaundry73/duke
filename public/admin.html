<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Owner inbox | Duke Forger</title><meta name="robots" content="noindex"/>
<link rel="stylesheet" href="/site.css"/>
<style>
.wrapA{max-width:1100px;margin:0 auto;padding:30px 20px 80px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0 26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}.stat b{display:block;font-size:26px}.stat span{color:var(--muted);font-size:12px}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px}
.tk.high{border-color:#a1473a}.tk.closed{opacity:.6}
.tk header{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.tk p{margin:6px 0;color:var(--soft);white-space:pre-wrap}
.tk details{margin-top:6px}.tk pre{white-space:pre-wrap;background:#0b1322;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;max-height:260px;overflow:auto}
.tk textarea{width:100%;background:#0b1322;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:8px;font:inherit;margin-top:8px}
.tk .row button{background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:6px;padding:7px 11px;cursor:pointer;font:inherit;font-size:12px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#1b2840;color:var(--muted)}.pill.open{background:#3a2420;color:var(--gold2)}
.err{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding:6px 0}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="/">Duke <em>Forger</em></a><nav><a href="/studio">Studio</a><a href="/faq">FAQ</a></nav></div></header>
<main class="wrapA"><p class="eyebrow">Owner inbox</p><h1 style="font-size:40px">Support and business</h1>
<div id="out"><p class="muted">Loading…</p></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){
  const r=await fetch('/api/admin/overview');if(r.status===401){location.href='/login?next=/admin';return;}
  const d=await r.json();if(!r.ok){document.getElementById('out').innerHTML=`<p>${esc(d.error)}</p>`;return;}
  const open=d.tickets.filter(t=>t.status==='open');
  document.getElementById('out').innerHTML=`<div class="stats"><div class="stat"><b>${d.users}</b><span>accounts</span></div><div class="stat"><b>${d.paying}</b><span>paying</span></div><div class="stat"><b>${d.trialing}</b><span>on free trial</span></div>
    <div class="stat"><b>$${d.mrr}</b><span>monthly revenue</span></div><div class="stat"><b>${open.length}</b><span>open tickets</span></div></div>
    <h2>Tickets</h2>${d.tickets.length?d.tickets.map(t=>`<div class="tk ${t.severity} ${t.status}" id="t_${t.id}"><header><b>#${t.id} · ${esc(t.subject)}</b><span><span class="pill ${t.status}">${t.status}</span> <span class="muted small">${new Date(t.at).toLocaleString()}</span></span></header>
      <div class="muted small">${esc(t.email||'visitor, no email')} · ${t.severity}${t.actions?.length?` · auto-fixes tried: ${t.actions.map(a=>esc(a.name)).join(', ')}`:''}</div><p>${esc(t.summary)}</p>
      ${t.replies?.length?t.replies.map(x=>`<div class="muted small">You replied ${new Date(x.at).toLocaleString()}: ${esc(x.text)}</div>`).join(''):''}
      <details><summary class="muted small">Conversation and diagnostics</summary><pre>${esc((t.transcript||[]).map(m=>`${m.role}: ${m.content}`).join('\n'))}\n\n${esc(JSON.stringify(t.context,null,1))}\n\nRecent server errors:\n${esc((t.errors||[]).map(e=>`${e.at} ${e.where}: ${e.message}`).join('\n')||'none')}</pre></details>
      <textarea rows="2" placeholder="Note or reply (the customer sees it under Help in the studio)"></textarea>
      <div class="row" style="gap:6px;margin-top:6px"><button data-id="${t.id}" data-act="reply">Save reply</button><button data-id="${t.id}" data-act="closed">Close ticket</button><button data-id="${t.id}" data-act="open">Reopen</button>${t.email?`<a href="mailto:${esc(t.email)}?subject=${encodeURIComponent('Re: '+t.subject+' [Ticket '+t.id+']')}" style="font-size:12px;align-self:center">Email customer</a>`:''}</div></div>`).join(''):'<p class="muted">No tickets yet.</p>'}
    <h2 style="margin-top:30px">Recent server errors</h2>${d.errors.length?d.errors.map(e=>`<div class="err">${new Date(e.at).toLocaleString()} · ${esc(e.where)} · ${esc(e.message)}</div>`).join(''):'<p class="muted">None.</p>'}`;
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const box=b.closest('.tk');const body=b.dataset.act==='reply'?{reply:box.querySelector('textarea').value}:{status:b.dataset.act};
    await fetch('/api/admin/tickets/'+b.dataset.id,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});load();});
}
load();
</script>
<script src="/help.js" defer></script>
</body>
</html>
